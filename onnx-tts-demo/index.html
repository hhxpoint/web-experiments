<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>纯前端本地TTS验证 - 镜像加速版</title>
</head>

<body>
  <h1>纯前端本地模型 TTS 测试</h1>
  <p>状态：<span id="status">等待初始化...</span></p>
  <input type="text" id="textInput" value="你好，这是通过镜像站下载并运行在本地的模型。" style="width: 400px;">
  <button id="generateBtn" disabled>开始合成</button>
  <div id="audioContainer"></div>

  <script type="module">
    // 1. 引入 Transformers.js 和 环境配置
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // --- 核心修复代码：指向国内镜像源 ---
    env.remoteHost = 'https://hf-mirror.com';
    // ------------------------------------

    const status = document.getElementById('status');
    const btn = document.getElementById('generateBtn');
    let synthesizer;

    async function init() {
      status.innerText = '正在从镜像站加载模型 (约 40MB)...';
      try {
        // 加载一个更稳定的中文模型
        synthesizer = await pipeline('text-to-speech', 'Xenova/mms-tts-zho', {
          quantized: true
        });
        status.innerText = '模型下载并加载成功！';
        btn.disabled = false;
      } catch (e) {
        console.error(e);
        status.innerText = '加载失败：' + e.message + ' (请刷新重试)';
      }
    }

    btn.onclick = async () => {
      const text = document.getElementById('textInput').value;
      if (!text) return;

      status.innerText = '正在本地合成中，请稍候...';
      btn.disabled = true;

      const startTime = performance.now();

      try {
        const result = await synthesizer(text);
        const duration = Math.round(performance.now() - startTime);

        const blob = new Blob([result.audio], { type: 'audio/wav' });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();

        status.innerText = `合成成功！耗时: ${duration}ms`;
      } catch (e) {
        status.innerText = '合成出错: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    init();
  </script>
</body>

</html>
